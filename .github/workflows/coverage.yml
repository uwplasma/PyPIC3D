name: Test Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","pypic"]') || 'ubuntu-24.04' }}
    timeout-minutes: 720  # 12 hours instead of the default 6
    env:
      PIP_NO_CACHE_DIR: "1"
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      JAX_NUM_CPU_DEVICES: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Create a temporary Python 3.12 environment
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/pypic-uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/pypic-python
        run: |
          uv venv --python 3.12 --seed "$RUNNER_TEMP/pypic-venv"
          echo "$RUNNER_TEMP/pypic-venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[relativity]'
          python -m pip install coverage filelock

      - name: Configure JAX devices and compilation cache
        id: jax_setup
        run: python .github/scripts/configure_jax_ci.py

      - name: Clear coverage data
        id: coverage_setup
        run: python -m coverage erase

      - name: Code test coverage
        run: python -m coverage run --append --context code -m unittest discover -s tests/code_tests -t . -p '*test*.py'

      - name: Physics test coverage
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        run: python -m coverage run --append --context physics -m unittest discover -s tests/physics_tests -t . -p '*test*.py'

      - name: Distributed test coverage
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        env:
          JAX_PLATFORMS: ${{ steps.jax_setup.outputs.distributed_platform }}
          JAX_NUM_CPU_DEVICES: "8"
        run: python -m coverage run --append --context distributed -m unittest discover -s tests/distributed_tests -t . -p '*test*.py'

      - name: Generate coverage report
        id: coverage_report
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        run: python -m coverage xml

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Display coverage summary
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        run: python -m coverage report

      - name: Report JAX compilation cache
        if: ${{ always() && steps.jax_setup.outcome == 'success' }}
        run: python .github/scripts/configure_jax_ci.py --report
