name: Test Coverage

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: self-hosted
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      JAX_NUM_CPU_DEVICES: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[relativity]'
          pip install coverage filelock

      - name: Configure JAX devices and compilation cache
        id: jax_setup
        run: python .github/scripts/configure_jax_ci.py

      - name: Clear coverage data
        id: coverage_setup
        run: python -m coverage erase

      - name: Code test coverage
        run: python -m coverage run --append --context code -m unittest discover -s tests/code_tests -t . -p '*test*.py'

      - name: Physics test coverage
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        run: python -m coverage run --append --context physics -m unittest discover -s tests/physics_tests -t . -p '*test*.py'

      - name: Distributed test coverage
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        env:
          JAX_PLATFORMS: ${{ steps.jax_setup.outputs.distributed_platform }}
          JAX_NUM_CPU_DEVICES: "8"
        run: python -m coverage run --append --context distributed -m unittest discover -s tests/distributed_tests -t . -p '*test*.py'

      - name: Generate coverage report
        id: coverage_report
        if: ${{ !cancelled() && steps.coverage_setup.outcome == 'success' }}
        run: python -m coverage xml

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Display coverage summary
        if: ${{ !cancelled() && steps.coverage_report.outcome == 'success' }}
        run: python -m coverage report

      - name: Report JAX compilation cache
        if: ${{ always() && steps.jax_setup.outcome == 'success' }}
        run: python .github/scripts/configure_jax_ci.py --report
