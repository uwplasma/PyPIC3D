name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      JAX_NUM_CPU_DEVICES: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Create CI virtual environment
        run: |
          venv_dir=$(mktemp -d "$RUNNER_TEMP/ci-venv.XXXXXX")
          python -m venv "$venv_dir"
          echo "$venv_dir/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[relativity]'
          python -m pip install filelock

      - name: Configure JAX devices and compilation cache
        id: jax_setup
        run: python .github/scripts/configure_jax_ci.py --per-fork-cache

      - name: Light code tests
        if: ${{ !cancelled() && steps.jax_setup.outcome == 'success' }}
        run: python -m unittest discover -s tests/light_tests/code_tests -t . -p '*test*.py'

      - name: Light physics tests
        if: ${{ !cancelled() && steps.jax_setup.outcome == 'success' }}
        run: python -m unittest discover -s tests/light_tests/physics_tests -t . -p '*test*.py'

      - name: Light distributed tests
        if: ${{ !cancelled() && steps.jax_setup.outcome == 'success' }}
        env:
          JAX_PLATFORMS: ${{ steps.jax_setup.outputs.distributed_platform }}
          JAX_NUM_CPU_DEVICES: "8"
        run: python -m unittest discover -s tests/light_tests/distributed_tests -t . -p '*test*.py'

      - name: Report JAX compilation cache
        if: ${{ always() && steps.jax_setup.outcome == 'success' }}
        run: python .github/scripts/configure_jax_ci.py --report
