# Builds the Sphinx documentation with warnings treated as errors, so a broken
# cross-reference or a malformed heading fails the build instead of silently
# degrading the published docs.

name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.in
    - name: Build documentation
      run: python -m sphinx -b html -W --keep-going docs docs/_build/html
