# This workflow will install Python dependencies, and run tests with a single version of Python 
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit Testing

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","pypic"]') || 'ubuntu-24.04' }}
    env:
      PIP_NO_CACHE_DIR: "1"
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "1"
      JAX_NUM_CPU_DEVICES: "1"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
        version: "0.13.6"
    - name: Create a temporary Python 3.12 environment
      env:
        UV_CACHE_DIR: ${{ runner.temp }}/pypic-uv-cache
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/pypic-python
      run: |
        uv venv --python 3.12 --seed "$RUNNER_TEMP/pypic-venv"
        echo "$RUNNER_TEMP/pypic-venv/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install '.[relativity]' filelock
    - name: Configure JAX devices and compilation cache
      id: jax_setup
      run: python .github/scripts/configure_jax_ci.py
    - name: Code tests
      run: python -m unittest discover -s tests/code_tests -t . -p '*test*.py'
    - name: Physics tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.jax_setup.outcome == 'success' }}
      run: python -m unittest discover -s tests/physics_tests -t . -p '*test*.py'
    - name: Distributed tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.jax_setup.outcome == 'success' }}
      env:
        JAX_PLATFORMS: ${{ steps.jax_setup.outputs.distributed_platform }}
        JAX_NUM_CPU_DEVICES: "8"
      run: python -m unittest discover -s tests/distributed_tests -t . -p '*test*.py'
    - name: Report JAX compilation cache
      if: ${{ always() && steps.jax_setup.outcome == 'success' }}
      run: python .github/scripts/configure_jax_ci.py --report
