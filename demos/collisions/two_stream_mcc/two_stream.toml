# Two cold-ish counter-streaming electron beams over an ion background (collisionless reference)
[simulation_parameters]
name = "Two-stream instability, collisionless"
seed = 0
t_wind = 5.413e-8
solver = "electrodynamic_yee"
Nx = 100
Ny = 1
Nz = 1
x_wind = 1
y_wind = 1
z_wind = 1
output_dir = "outputs/two_stream_mcc/collisionless"
cfl = 0.99
shape_factor = 2
current_calculation = "j_from_rhov"
relativistic = true

[plotting]
plotting_interval = 4
plot_openpmd_particles = false
plot_openpmd_fields = false

[particle1]
name = "electron1"
N_particles = 1500
number_density = 1.0e15
charge = -1.602e-19
mass = 9.1093837e-31
vth = 1.5e7
initial_vx = 0.5e8

[particle2]
name = "electron2"
N_particles = 1500
number_density = 1.0e15
charge = -1.602e-19
mass = 9.1093837e-31
vth = 1.5e7
initial_vx = -0.5e8

[particle3]
name = "ions"
N_particles = 3000
charge = 1.602e-19
mass = 1.67e-27
vth = 3.5e4
