# Two cold-ish counter-streaming electron beams over an ion background in a weakly ionized argon gas
[simulation_parameters]
name = "Two-stream instability with electron-neutral MCC"
seed = 0
t_wind = 5.413e-8
solver = "electrodynamic_yee"
Nx = 100
Ny = 1
Nz = 1
x_wind = 1
y_wind = 1
z_wind = 1
output_dir = "outputs/two_stream_mcc/mcc"
cfl = 0.99
shape_factor = 2
current_calculation = "j_from_rhov"
relativistic = true

[plotting]
plotting_interval = 4
plot_openpmd_particles = false
plot_openpmd_fields = false

[particle1]
name = "electron1"
N_particles = 1500
number_density = 1.0e15
charge = -1.602e-19
mass = 9.1093837e-31
vth = 1.5e7
initial_vx = 0.5e8

[particle2]
name = "electron2"
N_particles = 1500
number_density = 1.0e15
charge = -1.602e-19
mass = 9.1093837e-31
vth = 1.5e7
initial_vx = -0.5e8

[particle3]
name = "ions"
N_particles = 3000
charge = 1.602e-19
mass = 1.67e-27
vth = 3.5e4

# electron-argon Monte Carlo collisions: 300 K argon at 1.5e20 m^-3,
# constant elastic cross section (nu ~ n sigma v ~ 7.5e8 1/s) and an 11.5 eV excitation channel

[collisions.electron1_argon]
type = "background_mcc"
species = "electron1"
background_density = 1.5e20
background_temperature = 300.0
background_mass = 6.6335209e-26
[collisions.electron1_argon.elastic]
cross_section = 1.0e-19
[collisions.electron1_argon.excitation]
energy = 11.5
cross_section = [[0.0, 0.0], [11.5, 0.0], [11.5115, 2.0e-20], [1.0e4, 2.0e-20]]

[collisions.electron2_argon]
type = "background_mcc"
species = "electron2"
background_density = 1.5e20
background_temperature = 300.0
background_mass = 6.6335209e-26
[collisions.electron2_argon.elastic]
cross_section = 1.0e-19
[collisions.electron2_argon.excitation]
energy = 11.5
cross_section = [[0.0, 0.0], [11.5, 0.0], [11.5115, 2.0e-20], [1.0e4, 2.0e-20]]
