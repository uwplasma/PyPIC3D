# This is a configuration file for PyPIC3D

# This is a demonstration of a weibel instability in 1D3V
# using a temperature anisotropy in the z direction, which
# causes the exponential growth of the magnetic field energy 
# and the formation of filaments in the out of plane magnetic
# field and current density.


[simulation_parameters]
name = "Demo of a 1D Weibel instability with 40 electrons per cell"
Nt = 6000
bc = 'periodic'
solver = 'electrodynamic_yee'
Nx = 201
Ny = 1
Nz = 1
x_wind = 3e-1
y_wind = 1
z_wind = 1
verbose = false
cfl = 0.99
shape_factor = 2
relativistic = true

[plotting]
plot_errors = false
phaseSpace  = false
plotfields = false
plotting_interval = 30

[particle1]
name = "electron1"
N_per_cell =    40
charge = -1.602e-19
mass   = 9.1093837e-31
number_density = 1.0e15
Tx     = 296494.82871735515
Tz     = 29649482.87173552
Ty     = 0

[particle2]
name = "ion1"
N_per_cell =    40
charge = 1.602e-19
mass = 1.67e-27
Tx     = 296494.82871735515
Tz     = 29649482.87173552
Ty     = 0
