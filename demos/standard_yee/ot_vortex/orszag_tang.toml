# This is a configuration file for PyPIC3D
[simulation_parameters]
name = "Orszag-Tang Vortex"
t_wind =  1.6457396126418987e-09
bc = 'periodic'
solver = 'electrodynamic_yee'
Nx = 200
Ny = 200
Nz = 1
x_wind = 1
y_wind = 1
z_wind = 0.23555306590186725
verbose = false
cfl = 0.99
shape_factor = 2
particle_tile_nx = 200
particle_tile_ny = 200
particle_tile_nz = 1

[plotting]
plotting_interval = 1
plot_openpmd_fields = true
plotchargedensity = true
openpmd_field_queue_size =  5
openpmd_particle_queue_size = 5

[field1]
name = "Bx field"
type = 3
path = "Bx.npy"

[field2]
name = "By field"
type = 4
path = "By.npy"

[particle1]
name = "electrons"
N_particles = 8000000
weight = 2944479.279091469
charge = -1.602e-19
mass   = 9.1093837e-31
initial_x = 'electron_x.npy'
initial_y = 'electron_y.npy'
initial_z = 'electron_z.npy'
initial_vx = 'electron_vx.npy'
initial_vy = 'electron_vy.npy'
initial_vz = 'electron_vz.npy'


[particle2]
name = "ions"
N_particles = 8000000
charge = 1.602e-19
mass = 1.67e-27
initial_x = 'ion_x.npy'
initial_y = 'ion_y.npy'
initial_z = 'ion_z.npy'
initial_vx = 'ion_vx.npy'
initial_vy = 'ion_vy.npy'
initial_vz = 'ion_vz.npy'
update_x = false
update_y = false
update_z = false
